# Closing prices for the public record. GitHub drops many scheduled runs when it is busy (an hourly trigger
# through the evening fired about one time in three), so this starts once before the first tip-off and stays
# running, refreshing every tracked pick's closing price every 30 minutes until the last game has started.
# Free ESPN prices only (no Odds API credits). It updates the "data" branch archive; the site itself is
# rebuilt by pages.yml on its own schedule and reads the archive then.
name: Closing prices

on:
  schedule:
    - cron: '41 22 * * *'   # UTC, before the first tip-off (~23:00); a late start just shortens the loop
  workflow_dispatch:

permissions:
  contents: write   # push the archive to the data branch

concurrency:
  group: closing
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: cache
          key: espn-closing-${{ github.run_id }}
          restore-keys: espn-

      - name: Refresh closing prices every 30 minutes until 03:45 UTC
        env:
          FETCH_ODDS: 'false'
        run: |
          git config user.name "propdesk-bot"
          git config user.email "propdesk-bot@users.noreply.github.com"
          git fetch -q origin data
          git worktree add -q -B data archive origin/data
          # the stop time: 03:45 UTC on the morning after the day this run started
          end=$(date -u -d "$( [ "$(date -u +%H)" -ge 12 ] && echo tomorrow || echo today ) 03:45" +%s)
          while :; do
            for attempt in 1 2 3; do
              # start from the newest archive each time (pages.yml writes to it too), so a push never
              # overwrites picks or prices saved in between; the build is safe to repeat
              (cd archive && git fetch -q origin data && git reset -q --hard origin/data)
              ARCHIVE_DIR=archive node scripts/build-static.mjs > build.log 2>&1 || { tail -20 build.log; break; }
              grep -E '^(picks|record):' build.log || true
              (cd archive && git add picks && { git diff --cached --quiet && echo "no change"; } \
                || { git commit -qm "Closing prices $(date -u +%F' '%H:%M)" && git push -q origin HEAD:data; }) && break
              echo "push raced another update, retrying ($attempt)"
            done
            [ $(( $(date -u +%s) + 1800 )) -lt "$end" ] || break
            sleep 1800
          done
