# Evening refresh: the site rebuilt every 30 minutes from the afternoon until the last game has started,
# for late injury news (home page, best value, game cards) and closing prices for the public record (each build
# refreshes the closing price of every tracked pick before its tip-off).
# GitHub drops many scheduled runs when it is busy (an hourly trigger through the evening fired about one time in
# three), so this starts once and stays running, starting pages.yml itself each time; runs started that way
# aren't dropped. Free ESPN prices only (fetch_odds=false: no Odds API credits).
name: Evening refresh

on:
  schedule:
    # UTC. Weekend games tip as early as 17:00-20:30, and GitHub can start a scheduled run hours late (on 1 Nov the
    # 22:41 start ran at 01:47), so there are several starts: if one is still running, the next waits behind it
    # (same concurrency group) and only adds a refresh or two at the end.
    - cron: '41 15 * * *'
    - cron: '11 18 * * *'
    - cron: '41 21 * * *'
  workflow_dispatch:

permissions:
  actions: write   # start pages.yml

concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Rebuild the site every 30 minutes until 03:45 UTC
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # the stop time: 03:45 UTC on the morning after the day this run started
          end=$(date -u -d "$( [ "$(date -u +%H)" -ge 12 ] && echo tomorrow || echo today ) 03:45" +%s)
          while :; do
            gh workflow run pages.yml --repo "$REPO" --ref main -f fetch_odds=false && echo "rebuild started $(date -u +%H:%M)" \
              || echo "could not start a rebuild $(date -u +%H:%M)"
            [ $(( $(date -u +%s) + 1800 )) -lt "$end" ] || break
            sleep 1800
          done
