<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>Prop Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Prop Desk home">PROP<span>DESK</span></a>
  <div class="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search a player" autocomplete="off" spellcheck="false" aria-label="Search player" role="combobox" aria-expanded="false" aria-controls="ac">
    <kbd>/</kbd>
    <ul id="ac" class="ac" role="listbox" hidden></ul>
  </div>
  <nav class="nav">
    <a href="#/slip" class="slip-link">Slip <b id="slip-count" class="count" hidden>0</b></a>
    <a href="#/bets">Bets</a>
    <button id="odds-toggle" class="odds-toggle" title="Odds shown as fractional: tap for decimal" aria-label="Switch odds format">Odds 5/1</button>
  </nav>
</header>
<main id="view"></main>
<footer class="foot">
  <span id="data-note"></span>
  <span>For analysis only. Not betting advice. Gamble responsibly. 18+.</span>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
